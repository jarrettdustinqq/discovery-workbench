name: Validate source changes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: discovery-source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Test numeric engine and CSV validation
        run: node --test tests/engine.test.mjs
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install ephemeral Chromium test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/pip" install 'playwright==1.62.0'
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Exercise the checked-out browser application
        run: '"$RUNNER_TEMP/browser-venv/bin/python" tests/browser_test.py --browser-engine chromium --output evidence/browser-chromium-ci.json'
